<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Бүртгэл баталгаажуулах</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, p, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    @media only screen and (max-width: 620px) {
      .email-shell { padding: 24px 12px !important; }
      .email-card { padding: 36px 24px !important; }
      .email-heading { font-size: 28px !important; line-height: 1.25 !important; }
      .email-body { font-size: 16px !important; }
      .email-button { display: block !important; width: 100% !important; box-sizing: border-box !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#F9F7F6;font-family:Georgia,'Times New Roman',serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    Пянз Толгойт — бүртгэлээ баталгаажуулна уу.
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#F9F7F6;">
    <tr>
      <td align="center" class="email-shell" style="padding:48px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
          <tr>
            <td class="email-card" style="padding:48px 40px;text-align:center;">
              <h1 class="email-heading" style="margin:0 0 24px;font-size:36px;line-height:1.2;font-weight:700;color:#0A0A0A;font-family:Georgia,'Times New Roman',serif;">
                Пянз Толгойт-д тавтай морил
              </h1>
              <p class="email-body" style="margin:0 0 40px;font-size:18px;line-height:1.6;color:#0A0A0A;font-family:Georgia,'Times New Roman',serif;">
                Сайн байна уу? Манай платформд бүртгүүлсэнд баярлалаа.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:0 auto 48px;">
                <tr>
                  <td align="center" style="border-radius:999px;background-color:#0A0A0A;">
                    <a
                      href="{{ .ConfirmationURL }}"
                      class="email-button"
                      style="display:inline-block;padding:16px 36px;font-size:16px;line-height:1.2;font-weight:700;color:#FFFFFF;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:999px;"
                    >
                      Бүртгэл баталгаажуулах
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#6B6B6B;font-family:Georgia,'Times New Roman',serif;">
                Асуух зүйл гарвал бидэнтэй холбогдоорой.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:0 auto 32px;">
                <tr>
                  <td style="padding:0 12px;">
                    <a href="mailto:support@vinylhead.app" style="font-size:20px;line-height:1;color:#0A0A0A;text-decoration:none;" aria-label="И-мэйл">✉</a>
                  </td>
                  <td style="padding:0 12px;">
                    <a href="{{ .SiteURL }}" style="font-size:20px;line-height:1;color:#0A0A0A;text-decoration:none;" aria-label="Тусламж">?</a>
                  </td>
                  <td style="padding:0 12px;">
                    <a href="{{ .SiteURL }}" style="font-size:20px;line-height:1;color:#0A0A0A;text-decoration:none;" aria-label="Вэб">◉</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#A1A1A1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                © 2026 Пянз Толгойт. Бүх эрх хуулиар хамгаалагдсан.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
